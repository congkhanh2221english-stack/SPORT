<script>const WORDS=[{"id":1,"group":"A","en":"like","ipa":"/laɪk/","vi":"thích","tip":"like + N / V-ing; từ cơ bản, hoàn toàn đúng ngữ pháp.","ex":"I like playing football.","trans":"Tôi thích chơi bóng đá."},{"id":2,"group":"A","en":"love","ipa":"/lʌv/","vi":"rất thích, yêu thích","tip":"love + N / V-ing / to V; tình cảm mạnh hơn like.","ex":"I love playing sports.","trans":"Tôi rất thích chơi thể thao."},{"id":3,"group":"A","en":"enjoy","ipa":"/ɪnˈdʒɔɪ/","vi":"thích, thấy vui khi làm","tip":"enjoy + V-ing; không dùng enjoy to V.","ex":"I enjoy playing basketball.","trans":"Tôi thích chơi bóng rổ."},{"id":4,"group":"A","en":"be keen on + N / V-ing","ipa":"/biː kiːn ɒn/","vi":"rất thích, say mê","tip":"be keen on + V-ing; on là giới từ.","ex":"I’m keen on playing sports.","trans":"Tôi rất thích chơi thể thao."},{"id":5,"group":"A","en":"be into + N / V-ing","ipa":"/biː ˈɪntuː/","vi":"rất thích, mê","tip":"Văn nói thân mật; be into + N / V-ing.","ex":"I’m really into swimming.","trans":"Tôi rất mê bơi lội."},{"id":6,"group":"A","en":"be fond of + N / V-ing","ipa":"/biː fɒnd əv/","vi":"yêu thích, có thiện cảm với","tip":"be fond of + N / V-ing; sắc thái tình cảm.","ex":"I’m fond of outdoor activities.","trans":"Tôi thích các hoạt động ngoài trời."},{"id":7,"group":"A","en":"be a big fan of","ipa":"/biː ə bɪɡ fæn əv/","vi":"là người rất hâm mộ","tip":"Dùng với môn thể thao, đội bóng hoặc hoạt động.","ex":"I’m a big fan of football.","trans":"Tôi rất hâm mộ bóng đá."},{"id":8,"group":"A","en":"be passionate about","ipa":"/biː ˈpæʃənət əˈbaʊt/","vi":"đam mê","tip":"be passionate about + N / V-ing; mạnh hơn like.","ex":"I’m passionate about running.","trans":"Tôi đam mê chạy bộ."},{"id":9,"group":"A","en":"be enthusiastic about","ipa":"/biː ɪnˌθjuːziˈæstɪk əˈbaʊt/","vi":"hào hứng, nhiệt tình với","tip":"about + N / V-ing.","ex":"I’m enthusiastic about trying new sports.","trans":"Tôi rất hào hứng thử các môn thể thao mới."},{"id":10,"group":"A","en":"be interested in","ipa":"/biː ˈɪntrəstɪd ɪn/","vi":"quan tâm, thích tìm hiểu","tip":"be interested in + N / V-ing.","ex":"I’m interested in water sports.","trans":"Tôi quan tâm đến các môn thể thao dưới nước."},{"id":11,"group":"A","en":"play sports","ipa":"/pleɪ spɔːts/","vi":"chơi thể thao","tip":"play + các môn bóng; do sports / play sports tùy ngữ cảnh.","ex":"Playing sports keeps me active.","trans":"Chơi thể thao giúp tôi năng động."},{"id":12,"group":"A","en":"take part in sports","ipa":"/teɪk pɑːt ɪn spɔːts/","vi":"tham gia thể thao","tip":"take part in + N / V-ing.","ex":"I take part in sports at school.","trans":"Tôi tham gia các hoạt động thể thao ở trường."},{"id":13,"group":"B","en":"help sb (to) V","ipa":"/help ˈsʌmbədi tuː/","vi":"giúp ai làm gì","tip":"help + O + (to) V; cả hai cách đều đúng.","ex":"Sport helps me stay fit.","trans":"Thể thao giúp tôi giữ dáng."},{"id":14,"group":"B","en":"assist sb to V","ipa":"/əˈsɪst ˈsʌmbədi tuː/","vi":"hỗ trợ ai làm gì","tip":"Trang trọng hơn help, ít tự nhiên hơn help trong bài nói đời thường.","ex":"Regular exercise assists people to stay active.","trans":"Tập luyện đều đặn hỗ trợ mọi người duy trì vận động."},{"id":15,"group":"B","en":"allow sb to V","ipa":"/əˈlaʊ ˈsʌmbədi tuː/","vi":"cho phép, tạo điều kiện cho ai","tip":"allow + O + to V; nhấn mạnh cơ hội/khả năng.","ex":"Sport allows me to unwind.","trans":"Thể thao cho tôi cơ hội thư giãn."},{"id":16,"group":"B","en":"enable sb to V","ipa":"/ɪˈneɪbəl ˈsʌmbədi tuː/","vi":"giúp ai có khả năng làm gì","tip":"enable + O + to V; nhấn mạnh khả năng đạt kết quả.","ex":"Swimming enables me to stay fit.","trans":"Bơi giúp tôi duy trì sức khỏe."},{"id":17,"group":"B","en":"give sb a chance to V","ipa":"/ɡɪv ˈsʌmbədi ə tʃɑːns tuː/","vi":"cho ai cơ hội làm gì","tip":"give + O + a chance + to V.","ex":"Diving gives me a chance to explore the sea.","trans":"Lặn cho tôi cơ hội khám phá biển."},{"id":18,"group":"B","en":"create favourable conditions for sb to V","ipa":"/kriˈeɪt ˈfeɪvərəbəl kənˈdɪʃənz fə ˈsʌmbədi tuː/","vi":"tạo điều kiện thuận lợi để ai làm gì","tip":"Thường dùng số nhiều conditions; khá trang trọng.","ex":"Sports clubs create favourable conditions for students to practise.","trans":"Câu lạc bộ thể thao tạo điều kiện để học sinh luyện tập."},{"id":19,"group":"B","en":"well-being","ipa":"/ˌwel ˈbiːɪŋ/","vi":"sự khỏe mạnh, trạng thái an vui","tip":"Danh từ không đếm được; dùng physical/mental well-being.","ex":"Sports improve my well-being.","trans":"Thể thao cải thiện sức khỏe và tinh thần của tôi."},{"id":20,"group":"B","en":"physical well-being","ipa":"/ˈfɪzɪkəl ˌwel ˈbiːɪŋ/","vi":"sức khỏe thể chất","tip":"physical = thuộc thể chất.","ex":"Exercise improves my physical well-being.","trans":"Vận động cải thiện sức khỏe thể chất của tôi."},{"id":21,"group":"B","en":"mental well-being","ipa":"/ˈmentəl ˌwel ˈbiːɪŋ/","vi":"sức khỏe tinh thần","tip":"mental = thuộc tinh thần.","ex":"Running improves my mental well-being.","trans":"Chạy bộ cải thiện sức khỏe tinh thần của tôi."},{"id":22,"group":"B","en":"a sense of well-being","ipa":"/ə sens əv ˌwel ˈbiːɪŋ/","vi":"cảm giác khỏe khoắn, an vui","tip":"Nói tự nhiên: improve one’s sense of well-being.","ex":"Yoga gives me a sense of well-being.","trans":"Yoga đem lại cảm giác khỏe khoắn, thư thái."},{"id":23,"group":"B","en":"improve my well-being","ipa":"/ɪmˈpruːv maɪ ˌwel ˈbiːɪŋ/","vi":"cải thiện sức khỏe tổng thể","tip":"improve + sức khỏe/tình trạng.","ex":"Playing sports improves my well-being.","trans":"Chơi thể thao cải thiện sức khỏe của tôi."},{"id":24,"group":"B","en":"stay healthy","ipa":"/steɪ ˈhelθi/","vi":"giữ sức khỏe tốt","tip":"stay + tính từ; healthy là tính từ.","ex":"I exercise to stay healthy.","trans":"Tôi tập luyện để giữ sức khỏe."},{"id":25,"group":"B","en":"stay fit","ipa":"/steɪ fɪt/","vi":"giữ thể lực tốt","tip":"fit = khỏe, có thể lực tốt.","ex":"Football helps me stay fit.","trans":"Bóng đá giúp tôi giữ thể lực."},{"id":26,"group":"B","en":"keep fit","ipa":"/kiːp fɪt/","vi":"giữ dáng, giữ thể lực","tip":"Tương đương stay fit.","ex":"I go jogging to keep fit.","trans":"Tôi chạy bộ để giữ dáng."},{"id":27,"group":"B","en":"stay in shape","ipa":"/steɪ ɪn ʃeɪp/","vi":"giữ vóc dáng, thể trạng tốt","tip":"Cụm tự nhiên trong IELTS Speaking.","ex":"I swim twice a week to stay in shape.","trans":"Tôi bơi hai lần mỗi tuần để giữ dáng."},{"id":28,"group":"B","en":"be in good shape","ipa":"/biː ɪn ɡʊd ʃeɪp/","vi":"có thể trạng tốt","tip":"Trạng thái sức khỏe; không có nghĩa bắt buộc phải gầy.","ex":"She is in good shape.","trans":"Cô ấy có thể trạng tốt."},{"id":29,"group":"B","en":"improve my physical health","ipa":"/ɪmˈpruːv maɪ ˈfɪzɪkəl helθ/","vi":"cải thiện sức khỏe thể chất","tip":"Dùng khi nêu lý do chọn chơi thể thao.","ex":"Playing sports improves my physical health.","trans":"Chơi thể thao cải thiện sức khỏe thể chất của tôi."},{"id":30,"group":"B","en":"have a strong constitution","ipa":"/hæv ə strɒŋ ˌkɒnstɪˈtjuːʃən/","vi":"có thể trạng tốt, sức bền bỉ","tip":"constitution trong ngữ cảnh này = thể trạng; khá trang trọng.","ex":"He has a strong constitution.","trans":"Anh ấy có thể trạng khỏe mạnh."},{"id":31,"group":"B","en":"build a strong constitution","ipa":"/bɪld ə strɒŋ ˌkɒnstɪˈtjuːʃən/","vi":"xây dựng thể trạng khỏe mạnh","tip":"Cụm ít thông dụng hơn improve fitness.","ex":"Regular exercise can help build a strong constitution.","trans":"Tập đều có thể giúp xây dựng thể trạng khỏe mạnh."},{"id":32,"group":"B","en":"prevent weight gain","ipa":"/prɪˈvent weɪt ɡeɪn/","vi":"ngăn tăng cân","tip":"prevent + N / V-ing; weight gain là danh từ.","ex":"Exercise helps prevent weight gain.","trans":"Tập luyện giúp hạn chế tăng cân."},{"id":33,"group":"B","en":"maintain a healthy lifestyle","ipa":"/meɪnˈteɪn ə ˈhelθi ˈlaɪfstaɪl/","vi":"duy trì lối sống lành mạnh","tip":"maintain = giữ vững, duy trì.","ex":"Sport helps me maintain a healthy lifestyle.","trans":"Thể thao giúp tôi duy trì lối sống lành mạnh."},{"id":34,"group":"B","en":"physical fitness","ipa":"/ˈfɪzɪkəl ˈfɪtnəs/","vi":"thể lực","tip":"Danh từ; improve physical fitness.","ex":"Running improves my physical fitness.","trans":"Chạy bộ cải thiện thể lực của tôi."},{"id":35,"group":"B","en":"energetic","ipa":"/ˌenəˈdʒetɪk/","vi":"tràn đầy năng lượng","tip":"Tính từ; feel energetic.","ex":"I feel energetic after exercising.","trans":"Tôi cảm thấy tràn đầy năng lượng sau khi tập."},{"id":36,"group":"C","en":"relax","ipa":"/rɪˈlæks/","vi":"thư giãn","tip":"Động từ phổ thông; relax after studying.","ex":"I play sport to relax.","trans":"Tôi chơi thể thao để thư giãn."},{"id":37,"group":"C","en":"unwind","ipa":"/ʌnˈwaɪnd/","vi":"thư giãn sau căng thẳng","tip":"Paraphrase tự nhiên của relax sau giờ học/làm.","ex":"Football helps me unwind.","trans":"Bóng đá giúp tôi thư giãn."},{"id":38,"group":"C","en":"shake off stress","ipa":"/ʃeɪk ɒf stres/","vi":"giải tỏa căng thẳng","tip":"shake off = gạt bỏ cảm giác khó chịu.","ex":"Sports help me shake off stress.","trans":"Thể thao giúp tôi giải tỏa căng thẳng."},{"id":39,"group":"C","en":"shake off my fear","ipa":"/ʃeɪk ɒf maɪ fɪə/","vi":"xua tan nỗi sợ","tip":"Nhấn mạnh việc gạt bỏ cảm giác sợ.","ex":"I hope to shake off my fear of water.","trans":"Tôi hy vọng gạt bỏ nỗi sợ nước."},{"id":40,"group":"C","en":"overcome my fear","ipa":"/ˌəʊvəˈkʌm maɪ fɪə/","vi":"vượt qua nỗi sợ","tip":"overcome = vượt qua khó khăn hoặc nỗi sợ.","ex":"I want to overcome my fear of deep water.","trans":"Tôi muốn vượt qua nỗi sợ nước sâu."},{"id":41,"group":"C","en":"recharge my batteries","ipa":"/ˌriːˈtʃɑːdʒ maɪ ˈbætəriz/","vi":"nạp lại năng lượng","tip":"Thành ngữ: nghỉ ngơi để hồi phục năng lượng.","ex":"Sport helps me recharge my batteries.","trans":"Thể thao giúp tôi nạp lại năng lượng."},{"id":42,"group":"C","en":"boost my mood","ipa":"/buːst maɪ muːd/","vi":"cải thiện tâm trạng","tip":"boost = nâng lên; mood = tâm trạng.","ex":"Exercise can boost my mood.","trans":"Tập thể dục có thể cải thiện tâm trạng của tôi."},{"id":43,"group":"C","en":"reduce stress","ipa":"/rɪˈdjuːs stres/","vi":"giảm căng thẳng","tip":"Cách nói phổ biến, trực tiếp.","ex":"Swimming helps reduce stress.","trans":"Bơi giúp giảm căng thẳng."},{"id":44,"group":"C","en":"mental strength","ipa":"/ˈmentəl streŋθ/","vi":"sức mạnh tinh thần","tip":"Dùng khi nói về sự kiên trì, vượt khó.","ex":"Extreme sports can build mental strength.","trans":"Thể thao mạo hiểm có thể rèn sức mạnh tinh thần."},{"id":45,"group":"C","en":"mental resilience","ipa":"/ˈmentəl rɪˈzɪliəns/","vi":"khả năng phục hồi, bền bỉ tinh thần","tip":"Tự nhiên hơn train my mentality trong nhiều ngữ cảnh.","ex":"Challenges can improve my mental resilience.","trans":"Thử thách có thể tăng khả năng bền bỉ tinh thần."},{"id":46,"group":"C","en":"train my mentality","ipa":"/treɪn maɪ menˈtæləti/","vi":"rèn luyện tư duy, tinh thần","tip":"Hiểu được, nhưng thường tự nhiên hơn: build mental strength.","ex":"I want to build mental strength through sport.","trans":"Tôi muốn rèn sức mạnh tinh thần thông qua thể thao."},{"id":47,"group":"C","en":"challenge myself","ipa":"/ˈtʃælɪndʒ maɪˈself/","vi":"thử thách bản thân","tip":"challenge + oneself; diễn đạt mục tiêu cá nhân.","ex":"I enjoy sports that challenge me.","trans":"Tôi thích các môn thể thao thử thách bản thân."},{"id":48,"group":"C","en":"push my own limits","ipa":"/pʊʃ maɪ əʊn ˈlɪmɪts/","vi":"vượt qua giới hạn bản thân","tip":"Động từ push dùng tự nhiên trong văn nói.","ex":"Hiking helps me push my own limits.","trans":"Leo núi giúp tôi vượt giới hạn bản thân."},{"id":49,"group":"C","en":"break my own limits","ipa":"/breɪk maɪ əʊn ˈlɪmɪts/","vi":"phá vỡ giới hạn của bản thân","tip":"Trong văn nói thường tự nhiên hơn: push my limits.","ex":"I want to push my limits.","trans":"Tôi muốn vượt qua giới hạn của mình."},{"id":50,"group":"C","en":"step out of my comfort zone","ipa":"/step aʊt əv maɪ ˈkʌmfət zəʊn/","vi":"bước ra khỏi vùng an toàn","tip":"Cụm hữu ích khi giải thích muốn thử môn mới.","ex":"Diving helps me step out of my comfort zone.","trans":"Lặn giúp tôi bước ra khỏi vùng an toàn."},{"id":51,"group":"D","en":"popular","ipa":"/ˈpɒpjʊlə/","vi":"phổ biến, được yêu thích","tip":"popular in + địa điểm; popular with + nhóm người.","ex":"Football is popular in Vietnam.","trans":"Bóng đá phổ biến ở Việt Nam."},{"id":52,"group":"D","en":"be popular in","ipa":"/biː ˈpɒpjʊlə ɪn/","vi":"phổ biến tại","tip":"in + nơi chốn.","ex":"Football is popular in my country.","trans":"Bóng đá phổ biến ở nước tôi."},{"id":53,"group":"D","en":"one of the most popular sports","ipa":"/wʌn əv ðə məʊst ˈpɒpjʊlə spɔːts/","vi":"một trong những môn thể thao phổ biến nhất","tip":"one of + the most + adj + danh từ số nhiều.","ex":"Football is one of the most popular sports.","trans":"Bóng đá là một trong các môn thể thao phổ biến nhất."},{"id":54,"group":"D","en":"the most popular sport","ipa":"/ðə məʊst ˈpɒpjʊlə spɔːt/","vi":"môn thể thao phổ biến nhất","tip":"So sánh nhất với tính từ dài.","ex":"Football is the most popular sport here.","trans":"Bóng đá là môn thể thao phổ biến nhất ở đây."},{"id":55,"group":"D","en":"widely played","ipa":"/ˈwaɪdli pleɪd/","vi":"được chơi rộng rãi","tip":"Chỉ mức độ tham gia chơi, không đồng nghĩa hoàn toàn với được yêu thích.","ex":"Football is widely played in Vietnam.","trans":"Bóng đá được chơi rộng rãi ở Việt Nam."},{"id":56,"group":"D","en":"well-loved","ipa":"/ˌwel ˈlʌvd/","vi":"được yêu mến","tip":"Nhấn mạnh tình cảm của công chúng.","ex":"Football is a well-loved sport.","trans":"Bóng đá là môn thể thao được yêu mến."},{"id":57,"group":"D","en":"common","ipa":"/ˈkɒmən/","vi":"phổ biến, thường gặp","tip":"Common không phải lúc nào thay popular được (popular = được yêu thích).","ex":"Football is a common pastime.","trans":"Bóng đá là thú vui thường gặp."},{"id":58,"group":"D","en":"accessible","ipa":"/əkˈsesəbəl/","vi":"dễ tiếp cận","tip":"Môn thể thao dễ tham gia vì điều kiện, chi phí.","ex":"Football is accessible to most people.","trans":"Bóng đá dễ tiếp cận với phần lớn mọi người."},{"id":59,"group":"D","en":"simple rules","ipa":"/ˈsɪmpəl ruːlz/","vi":"luật chơi đơn giản","tip":"Giải thích tính phổ biến của môn thể thao.","ex":"Football has simple rules.","trans":"Bóng đá có luật chơi đơn giản."},{"id":60,"group":"D","en":"easy to learn","ipa":"/ˈiːzi tuː lɜːn/","vi":"dễ học","tip":"Dùng với môn thể thao hoặc kỹ năng.","ex":"Football is easy to learn.","trans":"Bóng đá dễ học."},{"id":61,"group":"D","en":"expensive equipment","ipa":"/ɪkˈspensɪv ɪˈkwɪpmənt/","vi":"thiết bị đắt tiền","tip":"Equipment là danh từ không đếm được.","ex":"It doesn’t require expensive equipment.","trans":"Môn này không cần thiết bị đắt tiền."},{"id":62,"group":"D","en":"does not require much equipment","ipa":"/dʌz nɒt rɪˈkwaɪə mʌtʃ ɪˈkwɪpmənt/","vi":"không cần nhiều dụng cụ","tip":"require + N; equipment không đếm được.","ex":"Football does not require much equipment.","trans":"Bóng đá không cần nhiều dụng cụ."},{"id":63,"group":"D","en":"people of all ages","ipa":"/ˈpiːpəl əv ɔːl ˈeɪdʒɪz/","vi":"mọi lứa tuổi","tip":"Dùng để nói về đối tượng tham gia.","ex":"People of all ages enjoy football.","trans":"Mọi lứa tuổi đều yêu thích bóng đá."},{"id":64,"group":"D","en":"bring people together","ipa":"/brɪŋ ˈpiːpəl təˈɡeðə/","vi":"gắn kết mọi người","tip":"bring + O + together.","ex":"Football brings people together.","trans":"Bóng đá gắn kết mọi người."},{"id":65,"group":"D","en":"a strong sense of community","ipa":"/ə strɒŋ sens əv kəˈmjuːnəti/","vi":"tinh thần cộng đồng mạnh mẽ","tip":"sense of + danh từ trừu tượng.","ex":"Sports create a strong sense of community.","trans":"Thể thao tạo tinh thần cộng đồng mạnh mẽ."},{"id":66,"group":"D","en":"bond with others","ipa":"/bɒnd wɪð ˈʌðəz/","vi":"gắn bó với người khác","tip":"bond with sb = tạo sự gắn kết.","ex":"I can bond with others through sport.","trans":"Tôi có thể gắn bó với người khác nhờ thể thao."},{"id":67,"group":"D","en":"major tournaments","ipa":"/ˈmeɪdʒə ˈtʊənəmənts/","vi":"các giải đấu lớn","tip":"tournament = giải thi đấu.","ex":"People watch football during major tournaments.","trans":"Mọi người xem bóng đá trong các giải lớn."},{"id":68,"group":"E","en":"because + clause","ipa":"/bɪˈkɒz/","vi":"bởi vì + mệnh đề","tip":"because + S + V; khác because of + N.","ex":"I play sports because I enjoy them.","trans":"Tôi chơi thể thao vì tôi thích chúng."},{"id":69,"group":"E","en":"thanks to + N / V-ing","ipa":"/ˈθæŋks tuː/","vi":"nhờ vào","tip":"Thường chỉ nguyên nhân tích cực, sau là N/V-ing.","ex":"Thanks to sport, I feel healthier.","trans":"Nhờ thể thao, tôi cảm thấy khỏe hơn."},{"id":70,"group":"E","en":"owing to + N / V-ing","ipa":"/ˈəʊɪŋ tuː/","vi":"do, bởi vì","tip":"Tương đương due to; khá trang trọng.","ex":"Owing to regular practice, I have improved.","trans":"Nhờ luyện tập đều, tôi đã tiến bộ."},{"id":71,"group":"E","en":"due to + N / V-ing","ipa":"/djuː tuː/","vi":"do, bởi vì","tip":"Dùng để nêu nguyên nhân; thường + N/cụm danh từ.","ex":"The match was cancelled due to rain.","trans":"Trận đấu bị hủy do mưa."},{"id":72,"group":"E","en":"by dint of + N / V-ing","ipa":"/baɪ dɪnt əv/","vi":"nhờ nỗ lực, bằng cách kiên trì","tip":"Nhấn mạnh đạt kết quả nhờ cố gắng; văn phong trang trọng.","ex":"By dint of hard work, she improved.","trans":"Nhờ nỗ lực, cô ấy tiến bộ."},{"id":73,"group":"E","en":"by virtue of + N / V-ing","ipa":"/baɪ ˈvɜːtʃuː əv/","vi":"nhờ vào, do có","tip":"Trang trọng; thường nói đến phẩm chất/đặc điểm.","ex":"She succeeded by virtue of her determination.","trans":"Cô ấy thành công nhờ quyết tâm."},{"id":74,"group":"E","en":"one reason why ... is that ...","ipa":"/wʌn ˈriːzən waɪ ɪz ðæt/","vi":"một lý do khiến… là…","tip":"Giúp giải thích ý rõ hơn; theo sau that là mệnh đề.","ex":"One reason why football is popular is that it is easy to play.","trans":"Một lý do bóng đá phổ biến là nó dễ chơi."},{"id":75,"group":"E","en":"besides","ipa":"/bɪˈsaɪdz/","vi":"ngoài ra","tip":"Từ nối bổ sung lợi ích khác; có thể đặt đầu câu.","ex":"Besides, sport helps me relax.","trans":"Ngoài ra, thể thao giúp tôi thư giãn."},{"id":76,"group":"E","en":"although","ipa":"/ɔːlˈðəʊ/","vi":"mặc dù","tip":"although + clause; không ghép although ... but ... .","ex":"Although I am nervous, I want to try it.","trans":"Mặc dù lo lắng, tôi vẫn muốn thử."},{"id":77,"group":"E","en":"even though","ipa":"/ˈiːvən ðəʊ/","vi":"mặc dù, cho dù","tip":"Nhấn mạnh sự tương phản.","ex":"Even though I am not good at sport, I enjoy it.","trans":"Dù không giỏi thể thao, tôi vẫn thích."},{"id":78,"group":"E","en":"when + clause","ipa":"/wen/","vi":"khi","tip":"when + mệnh đề, nêu thời điểm hoặc hoàn cảnh.","ex":"I feel better when I exercise.","trans":"Tôi thấy khỏe hơn khi tập luyện."},{"id":79,"group":"E","en":"only by + V-ing + can + S + V","ipa":"/ˈəʊnli baɪ/","vi":"chỉ bằng cách… thì… mới có thể","tip":"Đảo ngữ khi only by đứng đầu câu: can + chủ ngữ + V.","ex":"Only by practising regularly can I improve.","trans":"Chỉ bằng luyện tập đều đặn tôi mới tiến bộ."},{"id":80,"group":"E","en":"in the absence of + N","ipa":"/ɪn ði ˈæbsəns əv/","vi":"khi thiếu/vắng…","tip":"Danh từ theo sau; diễn tả tình huống không có điều gì.","ex":"In the absence of exercise, I feel less energetic.","trans":"Khi thiếu vận động, tôi thấy ít năng lượng hơn."},{"id":81,"group":"E","en":"have difficulty in + V-ing","ipa":"/hæv ˈdɪfɪkəlti ɪn/","vi":"gặp khó khăn khi làm gì","tip":"have difficulty (in) + V-ing.","ex":"I have difficulty in swimming in deep water.","trans":"Tôi gặp khó khăn khi bơi ở nước sâu."},{"id":82,"group":"F","en":"want to try","ipa":"/wɒnt tuː traɪ/","vi":"muốn thử","tip":"want + to V; câu cơ bản.","ex":"I want to try scuba diving.","trans":"Tôi muốn thử lặn bình khí."},{"id":83,"group":"F","en":"would like to try","ipa":"/wʊd laɪk tuː traɪ/","vi":"muốn thử (lịch sự)","tip":"would like + to V.","ex":"I’d like to try surfing.","trans":"Tôi muốn thử lướt sóng."},{"id":84,"group":"F","en":"would love to try","ipa":"/wʊd lʌv tuː traɪ/","vi":"rất muốn thử","tip":"Nhấn mạnh mong muốn; tự nhiên trong Speaking.","ex":"I’d love to try scuba diving.","trans":"Tôi rất muốn thử lặn bình khí."},{"id":85,"group":"F","en":"have a go at + N / V-ing","ipa":"/hæv ə ɡəʊ æt/","vi":"thử sức với","tip":"have a go at + N / V-ing; thân mật, Anh–Anh.","ex":"I’d like to have a go at scuba diving.","trans":"Tôi muốn thử sức với môn lặn bình khí."},{"id":86,"group":"F","en":"have a crack at + N / V-ing","ipa":"/hæv ə kræk æt/","vi":"thử sức với","tip":"Thân mật hơn have a go at; phù hợp văn nói.","ex":"I’d like to have a crack at surfing.","trans":"Tôi muốn thử sức với lướt sóng."},{"id":87,"group":"F","en":"down the road","ipa":"/daʊn ðə rəʊd/","vi":"trong tương lai","tip":"Cụm thân mật chỉ tương lai, không cần nói mốc chính xác.","ex":"I might try diving down the road.","trans":"Có thể sau này tôi sẽ thử lặn."},{"id":88,"group":"F","en":"down the line","ipa":"/daʊn ðə laɪn/","vi":"về sau, trong tương lai","tip":"Gần nghĩa down the road.","ex":"I hope to try surfing down the line.","trans":"Tôi hy vọng sau này thử lướt sóng."},{"id":89,"group":"F","en":"down the track","ipa":"/daʊn ðə træk/","vi":"sau này, trong tương lai","tip":"Cách nói thường gặp trong Anh–Úc; không phải lựa chọn phổ biến nhất ở Anh–Anh.","ex":"I may try climbing further down the track.","trans":"Có thể một thời gian nữa tôi thử leo núi."},{"id":90,"group":"F","en":"in the future","ipa":"/ɪn ðə ˈfjuːtʃə/","vi":"trong tương lai","tip":"Cách diễn đạt trung tính, an toàn.","ex":"I want to learn diving in the future.","trans":"Tôi muốn học lặn trong tương lai."},{"id":91,"group":"F","en":"extreme sports","ipa":"/ɪkˈstriːm spɔːts/","vi":"thể thao mạo hiểm","tip":"Môn có yếu tố rủi ro/thử thách cao.","ex":"Extreme sports can be exciting.","trans":"Thể thao mạo hiểm có thể rất thú vị."},{"id":92,"group":"F","en":"parachuting","ipa":"/ˈpærəʃuːtɪŋ/","vi":"nhảy dù","tip":"parachuting: nhảy dù bằng dù; skydiving: nhảy từ máy bay và rơi tự do.","ex":"I want to try parachuting one day.","trans":"Tôi muốn thử nhảy dù một ngày nào đó."},{"id":93,"group":"F","en":"mountain climbing","ipa":"/ˈmaʊntɪn ˌklaɪmɪŋ/","vi":"leo núi","tip":"Môn thể thao/hoạt động chinh phục núi.","ex":"Mountain climbing is challenging.","trans":"Leo núi khá thử thách."},{"id":94,"group":"F","en":"trekking","ipa":"/ˈtrekɪŋ/","vi":"đi bộ đường dài, vượt địa hình","tip":"Thường đi trong tự nhiên nhiều giờ/ngày.","ex":"Trekking helps me challenge myself.","trans":"Đi trekking giúp tôi thử thách bản thân."},{"id":95,"group":"F","en":"water sports","ipa":"/ˈwɔːtə spɔːts/","vi":"thể thao dưới nước","tip":"Gồm surfing, diving, swimming, v.v.","ex":"I’m interested in water sports.","trans":"Tôi quan tâm đến thể thao dưới nước."},{"id":96,"group":"F","en":"diving","ipa":"/ˈdaɪvɪŋ/","vi":"lặn, nhảy cầu","tip":"Ngữ cảnh quyết định là lặn dưới nước hay nhảy cầu.","ex":"I want to try diving.","trans":"Tôi muốn thử lặn."},{"id":97,"group":"F","en":"surfing","ipa":"/ˈsɜːfɪŋ/","vi":"lướt sóng","tip":"Cũng có thể nghĩa lướt Internet, tùy ngữ cảnh.","ex":"Surfing looks exciting.","trans":"Lướt sóng có vẻ thú vị."},{"id":98,"group":"F","en":"scuba diving","ipa":"/ˈskuːbə ˌdaɪvɪŋ/","vi":"lặn có bình dưỡng khí","tip":"scuba = hệ thống thở dưới nước có bình khí.","ex":"I’d like to try scuba diving.","trans":"Tôi muốn thử lặn bình khí."},{"id":99,"group":"F","en":"deep water","ipa":"/diːp ˈwɔːtə/","vi":"vùng nước sâu","tip":"afraid of deep water = sợ nước sâu.","ex":"I’m afraid of deep water.","trans":"Tôi sợ nước sâu."},{"id":100,"group":"F","en":"water phobia","ipa":"/ˈwɔːtə ˈfəʊbiə/","vi":"chứng sợ nước","tip":"Cụm mô tả nỗi sợ; trong hội thoại thường nói fear of water.","ex":"I have a fear of deep water.","trans":"Tôi có nỗi sợ nước sâu."},{"id":101,"group":"F","en":"have a fear of water","ipa":"/hæv ə fɪə əv ˈwɔːtə/","vi":"sợ nước","tip":"Tự nhiên hơn have water phobia trong văn nói đời thường.","ex":"I have a fear of deep water.","trans":"Tôi sợ nước sâu."},{"id":102,"group":"F","en":"marine creatures","ipa":"/məˈriːn ˈkriːtʃəz/","vi":"sinh vật biển","tip":"creature = sinh vật; marine = thuộc biển.","ex":"I’d love to see marine creatures.","trans":"Tôi rất muốn nhìn thấy các sinh vật biển."},{"id":103,"group":"F","en":"marine life","ipa":"/məˈriːn laɪf/","vi":"hệ sinh vật biển","tip":"Danh từ tập hợp; không đếm được trong nghĩa này.","ex":"I want to explore marine life.","trans":"Tôi muốn khám phá sinh vật biển."},{"id":104,"group":"F","en":"explore marine life","ipa":"/ɪkˈsplɔː məˈriːn laɪf/","vi":"khám phá thế giới sinh vật biển","tip":"Cụm tự nhiên hơn dig deeper into marine life khi nói đi lặn.","ex":"Diving allows me to explore marine life.","trans":"Lặn cho phép tôi khám phá sinh vật biển."},{"id":105,"group":"F","en":"get exposed to marine creatures","ipa":"/ɡet ɪkˈspəʊzd tuː məˈriːn ˈkriːtʃəz/","vi":"được tiếp xúc với sinh vật biển","tip":"get exposed to = có cơ hội tiếp xúc/trải nghiệm; trong nói có thể dùng see marine creatures.","ex":"Diving lets me get exposed to marine creatures.","trans":"Lặn cho tôi cơ hội tiếp xúc với sinh vật biển."},{"id":106,"group":"F","en":"get up close to marine creatures","ipa":"/ɡet ʌp kləʊs tuː məˈriːn ˈkriːtʃəz/","vi":"được quan sát sinh vật biển ở khoảng cách gần","tip":"get up close to = tiếp cận sát (an toàn, theo hướng dẫn).","ex":"I’d love to get up close to marine creatures.","trans":"Tôi muốn được quan sát sinh vật biển ở gần."},{"id":107,"group":"F","en":"dig deeper into","ipa":"/dɪɡ ˈdiːpə ˈɪntuː/","vi":"tìm hiểu sâu hơn","tip":"Ẩn dụ về nghiên cứu; thường dùng learn more about marine life tự nhiên hơn.","ex":"I want to dig deeper into marine biology.","trans":"Tôi muốn tìm hiểu sâu hơn về sinh học biển."},{"id":108,"group":"F","en":"the underwater world","ipa":"/ði ˌʌndəˈwɔːtə wɜːld/","vi":"thế giới dưới nước","tip":"underwater = dưới nước.","ex":"I want to explore the underwater world.","trans":"Tôi muốn khám phá thế giới dưới nước."},{"id":109,"group":"G","en":"prefer","ipa":"/prɪˈfɜː/","vi":"thích hơn","tip":"prefer + N/V-ing; prefer A to B.","ex":"I prefer playing sports.","trans":"Tôi thích chơi thể thao hơn."},{"id":110,"group":"G","en":"prefer V-ing to V-ing","ipa":"/prɪˈfɜː/","vi":"thích làm A hơn làm B","tip":"prefer + V-ing + to + V-ing; to ở đây là giới từ.","ex":"I prefer playing sports to watching them.","trans":"Tôi thích chơi hơn xem thể thao."},{"id":111,"group":"G","en":"watch sports","ipa":"/wɒtʃ spɔːts/","vi":"xem thể thao","tip":"watch + N.","ex":"I often watch sports on TV.","trans":"Tôi thường xem thể thao trên TV."},{"id":112,"group":"G","en":"the former","ipa":"/ðə ˈfɔːmə/","vi":"phương án thứ nhất","tip":"Dùng khi vừa nêu hai phương án A và B.","ex":"Watching or playing? I prefer the former.","trans":"Xem hay chơi? Tôi thích phương án đầu."},{"id":113,"group":"G","en":"the latter","ipa":"/ðə ˈlætə/","vi":"phương án thứ hai","tip":"Chỉ phương án B trong A or B.","ex":"Watching or playing? I prefer the latter.","trans":"Xem hay chơi? Tôi thích phương án sau."},{"id":114,"group":"G","en":"be more into","ipa":"/biː mɔː ˈɪntuː/","vi":"thích hơn, mê hơn","tip":"Văn nói thân mật; be more into + N/V-ing.","ex":"I’m more into playing than watching.","trans":"Tôi thích chơi hơn là xem."},{"id":115,"group":"G","en":"have a knack for + N / V-ing","ipa":"/hæv ə næk fə/","vi":"có năng khiếu về","tip":"for + N/V-ing; knack = tài năng tự nhiên.","ex":"I don’t have a knack for football.","trans":"Tôi không có năng khiếu bóng đá."},{"id":116,"group":"G","en":"be good at + N / V-ing","ipa":"/biː ɡʊd æt/","vi":"giỏi việc gì","tip":"at là giới từ; động từ theo sau ở V-ing.","ex":"I’m good at playing badminton.","trans":"Tôi chơi cầu lông giỏi."},{"id":117,"group":"G","en":"be more beneficial","ipa":"/biː mɔː ˌbenɪˈfɪʃəl/","vi":"có lợi hơn","tip":"be + comparative adj.","ex":"Playing is more beneficial for my health.","trans":"Chơi có lợi cho sức khỏe hơn."},{"id":118,"group":"G","en":"get more out of","ipa":"/ɡet mɔː aʊt əv/","vi":"thu được nhiều lợi ích hơn từ","tip":"get more out of + N/V-ing.","ex":"I get more out of playing than watching.","trans":"Tôi nhận được nhiều lợi ích hơn từ chơi so với xem."},{"id":119,"group":"H","en":"enjoy + V-ing","ipa":"/ɪnˈdʒɔɪ/","vi":"thích làm gì","tip":"enjoy chọn bổ ngữ dạng V-ing.","ex":"I enjoy playing football.","trans":"Tôi thích chơi bóng đá."},{"id":120,"group":"H","en":"look forward to + V-ing","ipa":"/lʊk ˈfɔːwəd tuː/","vi":"mong chờ việc gì","tip":"to là giới từ trong look forward to.","ex":"I look forward to playing football.","trans":"Tôi mong chờ được chơi bóng đá."},{"id":121,"group":"H","en":"want + to V","ipa":"/wɒnt tuː/","vi":"muốn làm gì","tip":"to là dấu hiệu của động từ nguyên mẫu.","ex":"I want to play football.","trans":"Tôi muốn chơi bóng đá."},{"id":122,"group":"H","en":"hope + to V","ipa":"/həʊp tuː/","vi":"hy vọng làm gì","tip":"hope + to-infinitive.","ex":"I hope to learn surfing.","trans":"Tôi hy vọng học lướt sóng."},{"id":123,"group":"H","en":"used to + V","ipa":"/ˈjuːst tuː/","vi":"đã từng làm trong quá khứ","tip":"Thói quen/trạng thái quá khứ thường không còn như trước.","ex":"I used to play football every day.","trans":"Tôi từng chơi bóng đá mỗi ngày."},{"id":124,"group":"H","en":"be used to + N / V-ing","ipa":"/biː ˈjuːst tuː/","vi":"đã quen với","tip":"to là giới từ, khác used to + V.","ex":"I am used to playing football daily.","trans":"Tôi đã quen chơi bóng mỗi ngày."},{"id":125,"group":"H","en":"get used to + N / V-ing","ipa":"/ɡet ˈjuːst tuː/","vi":"dần quen với","tip":"Nhấn mạnh quá trình làm quen.","ex":"I’m getting used to waking up early.","trans":"Tôi đang dần quen với việc dậy sớm."},{"id":126,"group":"H","en":"to + V (purpose)","ipa":"/tuː/","vi":"để làm gì (mục đích)","tip":"To-infinitive of purpose, không phải giới từ.","ex":"I wake up early to play football.","trans":"Tôi dậy sớm để chơi bóng đá."},{"id":127,"group":"H","en":"become good at + V-ing","ipa":"/bɪˈkʌm ɡʊd æt/","vi":"trở nên giỏi việc gì","tip":"at là giới từ, nên theo sau V-ing.","ex":"I want to become good at playing football.","trans":"Tôi muốn trở nên giỏi chơi bóng đá."}];</script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const rnd=a=>a.slice().sort(()=>Math.random()-.5);const bar=n=>`<div class="bar"><i style="width:${clamp(n,0,100)}%"></i></div>`;
const GS=[{id:'A',title:'Sở thích & paraphrase',emoji:'💖',desc:'like, love, be keen on…',color:'#ff839b'},{id:'B',title:'Sức khỏe & thể lực',emoji:'💪',desc:'stay fit, well-being…',color:'#95e4ff'},{id:'C',title:'Tinh thần & động lực',emoji:'🧠',desc:'shake off stress, recharge…',color:'#d9abff'},{id:'D',title:'Phổ biến & cộng đồng',emoji:'🏟️',desc:'widely played, bonding…',color:'#ffd47f'},{id:'E',title:'Liên kết ý & cấu trúc',emoji:'🔗',desc:'thanks to, only by…',color:'#84eeaf'},{id:'F',title:'Trải nghiệm thể thao',emoji:'🌊',desc:'scuba diving, adventures…',color:'#68dae8'},{id:'G',title:'Xem hay chơi?',emoji:'🎮',desc:'former, latter, knack…',color:'#ffb087'},{id:'H',title:'Socrates · Ngữ pháp',emoji:'🎓',desc:'used to, look forward to…',color:'#b1a4ff'}];
const NAV=[['home','🏠','Tổng quan'],['learn','📖','Kho 127 từ'],['quiz','⚡','Trắc nghiệm'],['flash','🃏','Thẻ lật'],['match','🧩','Ghép đôi'],['spell','✍️','Gõ từ'],['listen','🎧','Nghe & chọn'],['speak','🎤','Speaking Lab']];
const SPEAK=[{q:'Do you like sport?',qvi:'Bạn có thích thể thao không?',socrates:['Mình có thích thể thao không?','Tác dụng cụ thể của thể thao là gì?','Nêu một ví dụ về sức khỏe?','Có lợi ích tinh thần nào nữa?'],parts:[['Yes, I’m keen on playing sports.','Absolutely! I’m really into sports.','I enjoy playing sports.'],['They help me stay fit and healthy.','They enable me to improve my well-being.','They help me stay in good shape.'],['Besides, they help me shake off stress after studying.','They also allow me to unwind.','They’re a good way to recharge my batteries.']],sample:'Yes, I’m keen on playing sports because they help me stay healthy and improve my well-being. Besides, they allow me to shake off stress after studying.',keys:[['keen','into','enjoy','fond'],['fit','healthy','well-being','shape'],['stress','unwind','relax','batteries']]},{q:'Which sport is popular in your country?',qvi:'Môn thể thao nào phổ biến ở Việt Nam?',socrates:['Môn nào được chơi nhiều nhất?','Tại sao mọi người chọn môn đó?','Có dễ học và ít tốn tiền không?','Môn này kết nối mọi người thế nào?'],parts:[['Football is widely played in Vietnam.','I think football is one of the most popular sports in Vietnam.','Football is a well-loved sport in my country.'],['Thanks to its simple rules, it is easy to learn.','It does not require expensive equipment.','People of all ages can have a go at it.'],['Besides, it brings people together.','It creates a strong sense of community.','It helps people bond with others.']],sample:'I think football is one of the most popular sports in Vietnam. Thanks to its simple rules, it is easy to learn and does not require expensive equipment. Besides, it brings people together.',keys:[['football'],['easy','rules','equipment','ages'],['together','community','bond']]},{q:'Which sport do you want to try in the future?',qvi:'Bạn muốn thử môn thể thao nào trong tương lai?',socrates:['Mình muốn thử môn nào?','Nỗi sợ hiện tại là gì?','Mục tiêu bản thân là gì?','Có trải nghiệm thú vị nào sẽ có được?'],parts:[["I’d love to have a go at scuba diving down the road.","I’m keen to try scuba diving in the future.","I’d like to try a water sport, especially scuba diving."],['Although I’m afraid of deep water, I want to overcome my fear.','I want to step out of my comfort zone.','I have a fear of water, so I want to challenge myself.'],['It would allow me to explore marine life.','I could get up close to marine creatures.','It would give me a chance to discover the underwater world.']],sample:'I’d love to have a go at scuba diving in the future. Although I’m a little afraid of deep water, I want to overcome my fear. Besides, it would allow me to explore marine life.',keys:[['diving','water'],['fear','afraid','comfort','challenge'],['marine','underwater','creatures']]},{q:'Do you prefer watching or playing sports?',qvi:'Bạn thích xem hay chơi thể thao hơn?',socrates:['Mình thích watching hay playing hơn?','Tại sao lựa chọn ấy tốt hơn?','Lợi ích sức khỏe nào chứng minh?','Có lợi ích lối sống / tinh thần không?'],parts:[['I prefer the latter — playing sports.','I’m more into playing than watching sports.','I prefer playing sports.'],['Playing sports helps me stay fit.','It allows me to improve my physical health.','It helps me prevent weight gain.'],['Besides, it helps me unwind after studying.','It allows me to build a strong constitution.','It helps me maintain a healthy lifestyle.']],sample:'I prefer playing sports because it helps me stay fit and improve my physical health. Besides, it allows me to relax and maintain a healthy lifestyle.',keys:[['prefer','playing','latter'],['fit','health','weight'],['relax','unwind','lifestyle','constitution']]}];
const STORAGE='sport-quest-127-v2';const EMPTY={xp:0,correct:0,wrong:0,comboBest:0,mastery:{},seen:{},lastDay:'',dayStreak:0,sessionCount:0,bookmarks:{}};let P;try{P={...EMPTY,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){P={...EMPTY}};let S={page:'home',group:'all',size:10,challenge:'quiz',session:null,flashCards:[],flashIdx:0,flipped:false,filter:'all',search:'',match:null,speakIdx:0,picks:[0,0,0],showSample:false,spoken:'',speechFeedback:null};let ticking=null,recog=null;
const currentGroup=()=>GS.find(g=>g.id===S.group);const pool=()=>S.group==='all'?WORDS:WORDS.filter(w=>w.group===S.group);const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function save(){try{localStorage.setItem(STORAGE,JSON.stringify(P))}catch(e){} updateStats()}function lvl(){return Math.floor(P.xp/250)+1}function mastered(){return Object.values(P.mastery||{}).filter(n=>n>=2).length}function updateStats(){$('#xpVal').textContent=P.xp;$('#streakVal').textContent=P.dayStreak;$('#sideLevel').textContent=`Level ${lvl()} · ${P.xp%250}/250 XP`;$('#sideBar').style.width=(P.xp%250)/250*100+'%';$('#sideProgress').textContent=`${mastered()} / 127 cụm đã thuộc`;}function good(id,xp=10){const d=today(),last=P.lastDay;if(last!==d){if(last){const dd=(new Date(d+'T00:00:00')-new Date(last+'T00:00:00'))/86400000;P.dayStreak=(dd===1)?(P.dayStreak||0)+1:1;}else{P.dayStreak=1}P.lastDay=d}P.xp+=xp;P.correct++;P.mastery[id]=Math.min(3,(P.mastery[id]||0)+1);P.seen[id]=(P.seen[id]||0)+1;save()}function bad(id){P.wrong++;P.seen[id]=(P.seen[id]||0)+1;save()}function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.remove('show'),2900)}function boom(){const palette=['#5de5d9','#ffe292','#b9a2ff','#ff98c6','#c0ff7d'];for(let i=0;i<26;i++){const el=document.createElement('i');el.className='confetti';el.style.left=(40+Math.random()*35)+'vw';el.style.top=(18+Math.random()*15)+'vh';el.style.background=palette[i%palette.length];el.style.setProperty('--dx',(Math.random()*350-170)+'px');document.body.append(el);setTimeout(()=>el.remove(),1300)}}
function cleanTime(){if(ticking){clearInterval(ticking);ticking=null}if(recog){try{recog.stop()}catch(e){}recog=null}}function go(page){cleanTime();S.page=page;S.session=null;S.match=null;if(page==='flash')rebuildFlash();S.speechFeedback=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function setgroup(g){S.group=g;S.session=null;S.match=null;go('learn')}
function head(title,sub){return `<div class="sessionhead"><div><span class="eyebrow">SPORT QUEST • ${E(currentGroup()?.title||'127 expressions')}</span><h1 style="margin:8px 0">${title}</h1><p class="muted small">${sub}</p></div><span class="pill">🏅 LEVEL ${lvl()}</span></div>`}
function nav(){const m=NAV.map(([id,ico,title])=>`<button class="nav ${S.page===id?'active':''}" data-action="nav" data-page="${id}"><span>${ico}</span>${title}</button>`).join('');$('#sideNav').innerHTML=m;$('#mobileNav').innerHTML=[NAV[0],NAV[2],NAV[3],NAV[7],NAV[1]].map(([id,ico,title])=>`<button class="${S.page===id?'active':''}" data-action="nav" data-page="${id}"><span>${ico}</span>${title}</button>`).join('');$('#crumbNow').textContent=NAV.find(n=>n[0]===S.page)?.[2]||'Tổng quan'}
function home(){let count=mastered();let prog=count/127*100;let zones=GS.map(g=>{let arr=WORDS.filter(w=>w.group===g.id),n=arr.filter(w=>(P.mastery[w.id]||0)>=2).length;return `<div class="zone" role="button" tabindex="0" data-action="group" data-group="${g.id}"><span class="em">${g.emoji}</span><b>${g.title}</b><p>${g.desc} · ${arr.length} mục</p><div class="row between" style="margin-bottom:7px"><span class="mini-label">${n}/${arr.length} đã thuộc</span><span class="mini-label">${Math.round(n/arr.length*100)}%</span></div>${bar(n/arr.length*100)}</div>`}).join('');let modes=[['quiz','⚡','Thử thách 4 đáp án','Trả lời, nhận giải thích ngay'],['match','🧩','Ghép đôi thần tốc','Nối cụm tiếng Anh với nghĩa'],['flash','🃏','Lật thẻ 3D','IPA, phát âm và ghi nhớ'],['spell','✍️','Phản xạ gõ từ','Từ nghĩa Việt → cụm Anh'],['listen','🎧','Nghe và đoán','Luyện tai với giọng đọc UK'],['speak','🎤','Ghép idea Speaking','Socrates và suy luận ngược']];return `<div class="hero"><div><div class="eyebrow">⚡ YOUR ENGLISH ADVENTURE</div><h1>Làm chủ <em>127 từ &amp; cụm từ</em> qua trò chơi!</h1><p>IELTS Speaking Part 1 – SPORT. Học paraphrase, nghe phát âm, thử thách ghi nhớ và tự tạo câu trả lời 4 chủ đề với tư duy Socrates.</p><div class="row" style="margin-top:20px"><button class="btn primary" data-action="nav" data-page="quiz">🚀 CHƠI NGAY</button><button class="btn ghost" data-action="nav" data-page="speak">🎤 LUYỆN SPEAKING</button></div></div><div class="hero-art"><div class="orb"></div><div class="ball">⚽</div><span class="spark s1">✦</span><span class="spark s2">✦</span></div></div><div class="stats"><div class="stat"><div class="stat-icon">📚</div><div><small>TỔNG HỌC LIỆU</small><b>127</b><small>8 vùng kiến thức</small></div></div><div class="stat"><div class="stat-icon">🏆</div><div><small>ĐÃ THUỘC</small><b>${count}<span style="font-size:13px;color:#8498bb"> / 127</span></b><small>${Math.round(prog)}% hành trình</small></div></div><div class="stat"><div class="stat-icon">⚡</div><div><small>TỔNG ĐIỂM</small><b>${P.xp}</b><small>XP tích lũy</small></div></div><div class="stat"><div class="stat-icon">🔥</div><div><small>CHUỖI NGÀY HỌC</small><b>${P.dayStreak}</b><small>Kỷ lục combo ${P.comboBest||0}</small></div></div></div><div class="section-head"><div><h2>🗺️ Bản đồ kiến thức</h2><div class="subtle">Chọn bất kỳ chặng nào để học theo nhóm</div></div><a data-action="nav" data-page="learn">Xem tất cả →</a></div><div class="zones">${zones}</div><div class="section-head"><div><h2>🎮 Chọn chế độ chơi</h2><div class="subtle">Mỗi trò rèn một kỹ năng ghi nhớ khác nhau</div></div></div><div class="modegrid">${modes.map(m=>`<button class="modecard" data-action="nav" data-page="${m[0]}"><span class="mi">${m[1]}</span><b>${m[2]}</b><small>${m[3]}</small></button>`).join('')}</div><div class="hero-mini"><div class="row between"><div><b>🧠 Bí quyết học không cần thuộc lòng</b><div class="muted small" style="margin-top:4px">Answer → Reason → Benefit · Socrates → Paraphrase → Speaking</div></div><div class="row"><button class="btn purple" data-action="nav" data-page="speak">Thử tạo câu nói →</button><button class="btn ghost mini" data-action="export">📤 Sao lưu tiến độ</button><button class="btn ghost mini" data-action="resetAll">↻ Học lại từ đầu</button></div></div></div>`}
function groupSelect(){return `<div class="field"><label>CHỌN NHÓM TỪ</label><select class="select" id="groupSelect"><option value="all" ${S.group==='all'?'selected':''}>🌍 Tất cả 127 từ</option>${GS.map(g=>`<option value="${g.id}" ${S.group===g.id?'selected':''}>${g.emoji} ${g.title} (${WORDS.filter(w=>w.group===g.id).length})</option>`).join('')}</select></div>`}
function modeSetup(kind){const specs={quiz:['⚡ SPEED QUIZ','Trắc nghiệm 4 phương án: có ngay đáp án đúng, Feynman và câu hỏi Socrates.'],spell:['✍️ SPELL ARENA','Nhìn nghĩa tiếng Việt và gõ lại cụm tiếng Anh. Có gợi ý và đáp án.'],listen:['🎧 LISTENING ZONE','Nghe phát âm tiếng Anh, rồi chọn nghĩa tiếng Việt. Cần bật loa trình duyệt.'],match:['🧩 MATCH ARENA','Ghép 6 cụm từ với nghĩa tiếng Việt. Hoàn thành cặp để kiếm XP.']}[kind];return `${head(specs[0],specs[1])}<div class="panel" style="max-width:760px;margin:25px auto"><div style="font-size:54px;text-align:center">${kind==='quiz'?'⚡':kind==='spell'?'✍️':kind==='listen'?'🎧':'🧩'}</div><h2 style="text-align:center;margin:8px 0 10px">Thiết lập thử thách</h2><p class="muted small" style="text-align:center">Nội dung thật từ bộ 127 mục. Tiến độ được lưu trong trình duyệt.</p><div class="controlbar" style="margin:22px 0">${groupSelect()}<div class="field"><label>SỐ CÂU / LƯỢT</label><select class="select" id="sizeSelect" ${kind==='match'?'disabled':''}><option value="10" ${S.size===10?'selected':''}>10 câu nhanh</option><option value="20" ${S.size===20?'selected':''}>20 câu tiêu chuẩn</option><option value="all" ${S.size==='all'?'selected':''}>Tất cả trong nhóm</option></select></div></div><div class="row" style="justify-content:center;margin:17px 0"><span class="tag">⭐ Đúng +XP</span><span class="tag">🧠 Giải thích sai</span><span class="tag">⌨️ Enter để tiếp</span></div><div class="row" style="justify-content:center"><button class="btn primary" data-action="start" data-kind="${kind}">🚀 BẮT ĐẦU</button>${kind==='quiz'?'<button class="btn ghost" data-action="sprint">⏱️ SPRINT 20 GIÂY</button>':''}</div></div>`}
const getW=id=>WORDS.find(x=>x.id===id);function createOpts(w,direction){let target=direction==='vi'?w.vi:w.en,alt=pool().filter(x=>x.id!==w.id&&((direction==='vi'?x.vi:x.en)!==target));alt=rnd(alt);let o=[{val:target,right:true,id:w.id}],seen=new Set([target]);for(const x of alt.concat(rnd(WORDS.filter(x=>x.id!==w.id)))){let v=direction==='vi'?x.vi:x.en;if(!seen.has(v)){seen.add(v);o.push({val:v,right:false,id:x.id})}if(o.length>=4)break}return rnd(o)}
function init(kind,sprint=false){cleanTime();let p=rnd(pool());let n=S.size==='all'?p.length:Math.min(+S.size,p.length);if(kind==='match'){S.match={pairs:[],selected:null,matched:[],mistakes:0,score:0,done:false};let pairs=[];const seen=new Set();for(const w of p.concat(rnd(WORDS))){if(seen.has(w.vi))continue;seen.add(w.vi);pairs.push(w);if(pairs.length>=6)break}S.match.pairs=pairs;S.match.left=rnd(pairs);S.match.right=rnd(pairs);S.session={kind:'match'};return render()}
S.session={kind,sprint,index:0,questions:p.slice(0,n),scored:0,errors:0,combo:0,hearts:sprint?3:999,answered:false,chosen:null,opts:null,direction:'vi',typed:'',seconds:20,hint:false};nextPrompt();render()}
function nextPrompt(){if(!S.session)return;const s=S.session;if(s.index>=s.questions.length){S.session.done=true;return}let w=s.questions[s.index];s.direction=s.kind==='quiz'&&Math.random()<.38?'en':'vi';s.opts=createOpts(w,s.direction==='en'?'en':'vi');s.answered=false;s.chosen=null;s.typed='';s.hint=false;s.seconds=20;if(s.sprint){clearInterval(ticking);ticking=setInterval(()=>{if(!S.session||S.session!==s||s.answered)return;--s.seconds;let el=$('#timerNumber');if(el)el.textContent=s.seconds+'s';let i=$('#timerWidth');if(i)i.style.width=s.seconds/20*100+'%';if(s.seconds<=0)handleAnswer(-1)},1000)}}
function currentWord(){return S.session?.questions[S.session.index]}
function handleAnswer(which){const s=S.session;if(!s||s.answered)return;let w=currentWord();let ok=false;if(s.kind==='spell'){let val=($('input#typed')?.value||'').trim();if(!val)return;const norm=v=>String(v).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9+\s/\-]/g,'').replace(/\s+/g,' ').trim();ok=norm(val)===norm(w.en);s.typed=val}else{if(which==null)return;s.chosen=which;ok=which>=0&&s.opts[which]&&s.opts[which].right}clearInterval(ticking);ticking=null;s.answered=true;s.correct=ok;if(ok){s.scored++;s.combo++;good(w.id,10+Math.min(12,s.combo*2));if(s.combo>=(P.comboBest||0))P.comboBest=s.combo;if(s.combo%5===0){notify('🔥 COMBO '+s.combo+'! Xuất sắc!');boom()}}else{s.errors++;s.combo=0;if(s.sprint)s.hearts--;bad(w.id)}render()}
function explain(w,ok){let cat=GS.find(g=>g.id===w.group);const soc={A:'Sắc thái của cụm này khác “like” ở điểm nào?',B:'Cụm này đang nói về sức khỏe thể chất hay tinh thần?',C:'Ý tưởng này giúp phát triển lý do hay lợi ích của câu trả lời?',D:'Nói “popular” và “widely played” có luôn giống hệt nhau không?',E:'Từ/cụm đứng sau liên từ hoặc giới từ phải ở dạng nào?',F:'Trải nghiệm này giúp vượt qua nỗi sợ hay khám phá điều mới?',G:'Trong “A or B”, “the latter” chỉ phương án nào?',H:'Hãy tìm chức năng của từ “to” hoặc giới từ trong cả cấu trúc.'};return `<div class="feedback ${ok?'':'bad'}"><h3>${ok?'✅ CHÍNH XÁC!':'💡 ĐÁP ÁN & GIẢI THÍCH'}</h3><p><b>${E(w.en)}</b> <span style="color:#80e9e7">${E(w.ipa)}</span> → <b>${E(w.vi)}</b></p><p>🔍 <b>Feynman:</b> ${E(w.tip)}</p><p>🗣️ <b>Ví dụ:</b> ${E(w.ex)}<br><span class="muted">${E(w.trans)}</span></p><p>🧠 <b>Socrates:</b> ${E(soc[w.group])}</p></div>`}
function questionScreen(){const s=S.session;if(s.done){return finishView(s)}let w=currentWord(),prog=s.index/s.questions.length*100;let isListen=s.kind==='listen',isSpell=s.kind==='spell';let opts=s.opts.map((o,i)=>`<button class="option ${s.answered&&o.right?'correct':''} ${s.answered&&s.chosen===i&&!o.right?'wrong':''} ${!s.answered&&s.chosen===i?'chosen':''}" data-action="choose" data-idx="${i}" ${s.answered?'disabled':''}><span class="key">${i+1}</span>${E(o.val)}</button>`).join('');return `<div class="quizwrap">${head(isListen?'🎧 Listening Challenge':isSpell?'✍️ Spell Arena':'⚡ Speed Quiz','Chơi thật – nhớ lâu. Đúng/sai được phản hồi ngay với giải thích và ví dụ.')}
<div class="panel"><div class="testtop"><span class="pill">CÂU ${s.index+1}/${s.questions.length}</span><span class="hearts">${s.sprint?'♥'.repeat(Math.max(0,s.hearts))+'<span style="opacity:.28">'+'♥'.repeat(3-Math.max(0,s.hearts))+'</span>':'<span class="tag">♾️ Luyện tự do</span>'}</span><span class="pill">⚡ COMBO ${s.combo}</span></div>${bar(prog)}${s.sprint?`<div class="row between" style="margin-top:11px"><span class="small">⏱️ Còn lại</span><strong id="timerNumber">${s.seconds}s</strong></div><div class="bar" style="margin-top:7px"><i id="timerWidth" style="width:${s.seconds/20*100}%;background:linear-gradient(90deg,#ffb55d,#ff6a86)"></i></div>`:''}
${isListen?`<div style="text-align:center"><button class="listen-orb" data-action="hear" aria-label="Phát âm"><span class="sym">🔊</span></button><span class="eyebrow">NGHE CỤM TỪ VÀ CHỌN NGHĨA</span><p class="muted small">Nhấn loa để nghe lại · Giọng UK nếu trình duyệt hỗ trợ</p></div>`:isSpell?`<div class="eyebrow" style="margin-top:23px">DỊCH NGƯỢC VIỆT → ANH</div><div class="question">${E(w.vi)}</div><p class="muted small">Gõ từ/cụm từ tiếng Anh tương ứng. Công thức ngữ pháp có thể chứa “+”.</p><input id="typed" class="input" style="font-size:16px;margin-top:10px" placeholder="Type the English expression…" autocomplete="off" ${s.answered?'disabled':''} value="${E(s.typed)}">${s.hint?`<div class="hintbox" style="margin-top:10px">🔎 Chữ đầu: <span class="letterhint">${E(w.en[0])}</span> · Tổng ${w.en.length} ký tự</div>`:''}<div class="row" style="margin-top:12px"><button class="btn ghost mini" data-action="spellhint" ${s.answered?'disabled':''}>💡 Gợi ý chữ đầu</button><button class="btn ghost mini" data-action="hear">🔊 Nghe</button></div>`:`<div class="eyebrow" style="margin-top:23px">${s.direction==='vi'?'CHỌN NGHĨA TIẾNG VIỆT':'CHỌN CỤM TỪ TIẾNG ANH'}</div><div class="question">${E(s.direction==='vi'?w.en:w.vi)}</div>${s.direction==='vi'?`<div class="row"><span class="ipa">${E(w.ipa)}</span><button class="btn ghost mini" data-action="hear">🔊 Phát âm</button></div>`:''}`}
${!isSpell?`<div class="answergrid">${opts}</div>`:''}${s.answered?explain(w,s.correct):''}<div class="row between" style="margin-top:19px"><span class="kbd">${isSpell?'Enter để chấm bài':'Phím 1–4 để chọn'} · Enter để tiếp</span><div class="row">${s.answered?`<button class="btn primary" data-action="next">${s.index+1===s.questions.length?'🏆 Xem kết quả':'Tiếp theo →'}</button>`:isSpell?`<button class="btn primary" data-action="gradeSpell">Kiểm tra đáp án ✓</button>`:'<span class="small muted">Chọn 1 đáp án để kiểm tra</span>'}</div></div></div></div>`}
function next(){let s=S.session;if(!s||!s.answered)return;s.index++;if(s.index>=s.questions.length||(s.sprint&&s.hearts<=0))s.done=true;else nextPrompt();render()}
function finishView(s){clearInterval(ticking);ticking=null;let num=s.questions.length,pct=Math.round((s.scored/(s.scored+s.errors||1))*100);let medal=s.scored>=num*.9?'🥇':s.scored>=num*.65?'🥈':'🥉';if(s.scored>=5)boom();return `<div class="done panel"><div class="trophy">${medal}</div><div class="eyebrow">CHẶNG THỬ THÁCH HOÀN THÀNH</div><h1>${s.sprint&&s.hearts<=0?'Bạn đã hết lượt tim!':'Giỏi lắm, nhà vô địch!'}</h1><div class="score">${s.scored} / ${num}</div><p class="muted">Đúng ${s.scored} · Sai ${s.errors} · Độ chính xác ${pct}% · Kỷ lục combo ${P.comboBest}</p><div class="row" style="justify-content:center;margin:25px 0"><span class="pill">⭐ ${P.xp} XP</span><span class="pill">📚 ${mastered()}/127 đã thuộc</span></div><div class="row" style="justify-content:center"><button class="btn primary" data-action="restart" data-kind="${s.kind}" data-sprint="${s.sprint?'true':'false'}">🔁 Chơi lại</button><button class="btn ghost" data-action="nav" data-page="home">🏠 Về bản đồ</button></div></div>`}
function matchScreen(){let m=S.match;if(m.done){return `<div class="done panel"><div class="trophy">🧩</div><h1>Ghép đôi hoàn tất!</h1><div class="score">6 / 6</div><p class="muted">Sai ${m.mistakes} lần · Thêm ${m.score} XP</p><button class="btn primary" data-action="start" data-kind="match">🔁 Thử bộ khác</button> <button class="btn ghost" data-action="nav" data-page="home">Về trang chủ</button></div>`}return `${head('🧩 Match Arena','Chọn một ô tiếng Anh rồi chọn ô nghĩa tương ứng. Mỗi cặp đúng +8 XP.')}
<div class="panel" style="max-width:940px;margin:15px auto"><div class="testtop"><span class="pill">✨ ${m.matched.length}/6 cặp đúng</span><span class="pill">⚡ ${m.score} XP</span><span class="pill">❌ ${m.mistakes} lỗi</span></div>${bar(m.matched.length/6*100)}<div class="match-grid" style="margin-top:20px"><div class="matchcol"><span class="eyebrow">🇬🇧 TỪ/CỤM TỪ</span>${m.left.map(w=>matchTile(w,'en')).join('')}</div><div class="matchcol"><span class="eyebrow">🇻🇳 NGHĨA TIẾNG VIỆT</span>${m.right.map(w=>matchTile(w,'vi')).join('')}</div></div><p class="muted small" style="text-align:center;margin:20px 0 0">💡 Nếu ghép sai, bạn có thể thử lại ngay. Trò chơi không khóa tiến độ.</p></div>`}
function matchTile(w,side){let m=S.match;let key=side+':'+w.id;return `<button class="mtile ${m.matched.includes(w.id)?'matched':''} ${m.selected===key?'sel':''}" data-action="tile" data-id="${w.id}" data-side="${side}" ${m.matched.includes(w.id)?'disabled':''}>${E(side==='en'?w.en:w.vi)}</button>`}
function tile(side,id){const m=S.match;if(!m||m.done)return;let key=side+':'+id;if(!m.selected){m.selected=key;render();return}let [s1,id1]=m.selected.split(':');if(s1===side){m.selected=key;render();return}m.selected=null;if(+id1===+id){m.matched.push(+id);m.score+=8;good(+id,8);if(m.matched.length===6){m.done=true;boom()}else notify('✅ Đúng rồi! +8 XP')}else{m.mistakes++;notify('❌ Chưa khớp. Nhìn kỹ nghĩa rồi thử lại!')}render()}
function rebuildFlash(){S.flashCards=pool().slice().sort((a,b)=>(P.mastery[a.id]||0)-(P.mastery[b.id]||0));S.flashIdx=0;S.flipped=false}
function flash(){if(!S.flashCards.length)rebuildFlash();let w=S.flashCards[S.flashIdx];if(!w)return `<div class="panel">Chưa có dữ liệu.</div>`;return `${head('🃏 Flashcard 3D','Lật thẻ để xem nghĩa, IPA và ví dụ. Đánh dấu chưa thuộc hoặc đã thuộc.')}
<div class="controlbar" style="margin-bottom:19px">${groupSelect()}<button class="btn ghost" data-action="rebuildFlash">↻ Trộn lại / ưu tiên từ yếu</button></div><div class="flashstage"><div class="row between" style="margin-bottom:11px"><span class="pill">THẺ ${S.flashIdx+1}/${S.flashCards.length}</span><span class="pill">⭐ ${P.mastery[w.id]||0}/3 mức ghi nhớ</span></div>${bar((S.flashIdx+1)/S.flashCards.length*100)}<div class="flashcard ${S.flipped?'flipped':''}" data-action="flip" style="margin-top:19px"><div class="flashinner"><div class="face front"><span class="pill" style="margin-bottom:25px">${E(GS.find(g=>g.id===w.group)?.title)}</span><div class="huge">${E(w.en)}</div><div class="ipa">${E(w.ipa)}</div><div class="flash-meta">👆 Nhấn để lật thẻ xem nghĩa</div></div><div class="face back"><span class="eyebrow" style="margin-bottom:14px">MEANING & EXPLANATION</span><div class="huge">${E(w.vi)}</div><p class="muted small" style="margin:14px 0 8px">${E(w.tip)}</p><div class="quote" style="font-size:12px">${E(w.ex)}<br><span class="muted">${E(w.trans)}</span></div></div></div></div><div class="row between" style="margin-top:16px"><button class="btn ghost" data-action="flashprev">← Trước</button><button class="btn ghost" data-action="say" data-id="${w.id}">🔊 UK</button><button class="btn purple" data-action="flashnext" data-rate="0">😅 Chưa thuộc</button><button class="btn primary" data-action="flashnext" data-rate="1">✅ Đã thuộc</button></div><div class="kbd" style="margin-top:18px;text-align:center">Phím ← → chuyển thẻ · Space lật thẻ · Click để nghe IPA bằng giọng máy</div></div>`}
function flashNext(rate){const w=S.flashCards[S.flashIdx];if(rate===1){good(w.id,4);notify('🌟 Đã lưu tiến độ của thẻ này!')}else{P.mastery[w.id]=Math.max(0,(P.mastery[w.id]||0)-1);P.seen[w.id]=(P.seen[w.id]||0)+1;save()}S.flashIdx=(S.flashIdx+1)%S.flashCards.length;S.flipped=false;render()}
function voice(text){if(!('speechSynthesis' in window)){notify('Trình duyệt không hỗ trợ phát âm tự động.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(text).replace(/\+\s*(N|V-ing|V|clause|S|sb)(\s*\/\s*(N|V-ing|V))?/gi,'').replace(/\bsb\b/g,'somebody'));u.lang='en-GB';u.rate=.78;u.pitch=1;let vv=speechSynthesis.getVoices();u.voice=vv.find(v=>/^en-GB$/i.test(v.lang))||vv.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}catch(e){notify('Không thể phát âm trong trình duyệt này.')}}
function learn(){let groupText=S.group==='all'?'Tất cả 127 mục':currentGroup().title;let arr=pool().filter(w=>{let q=S.search.toLowerCase().trim();return (!q||[w.en,w.vi,w.tip,w.ipa].some(x=>x.toLowerCase().includes(q)))&&(S.filter==='all'||S.filter==='weak'&&(P.mastery[w.id]||0)<2||S.filter==='known'&&(P.mastery[w.id]||0)>=2||S.filter==='starred'&&P.bookmarks[w.id])});return `${head('📚 Từ điển tương tác',`Đầy đủ ${WORDS.length} mục · IPA Anh–Anh, nghĩa, giải thích Feynman và ví dụ`)}<div class="panel soft"><div class="controlbar">${groupSelect()}<div class="field"><label>TÌM THEO TỪ / NGHĨA / IPA</label><input class="input" id="searchWord" value="${E(S.search)}" placeholder="Ví dụ: keen on, well-being…"></div><div class="field" style="min-width:142px;flex:0 1 165px"><label>BỘ LỌC</label><select class="select" id="filterWord"><option value="all" ${S.filter==='all'?'selected':''}>Tất cả</option><option value="weak" ${S.filter==='weak'?'selected':''}>Cần ôn</option><option value="known" ${S.filter==='known'?'selected':''}>Đã thuộc</option><option value="starred" ${S.filter==='starred'?'selected':''}>Đã đánh dấu</option></select></div></div><div class="row between" style="margin:19px 0 12px"><b>${E(groupText)}</b><span class="muted small">Hiển thị ${arr.length} mục</span></div><div class="listcards">${arr.map(w=>`<div class="wordcard"><div class="row between"><span class="tag">${E(w.group)}-${String(w.id).padStart(3,'0')}</span><span class="muted small">${'⭐'.repeat(Math.min(3,P.mastery[w.id]||0))}${'☆'.repeat(3-Math.min(3,P.mastery[w.id]||0))}</span></div><h3 style="margin-top:11px">${E(w.en)}</h3><div class="ipa">${E(w.ipa)}</div><p><b style="color:#fff">${E(w.vi)}</b></p><p class="muted">${E(w.tip)}</p><div class="mutedline"></div><p class="ex">💬 ${E(w.ex)}<br><span class="muted">${E(w.trans)}</span></p><div class="foot"><button class="btn mini ghost" data-action="say" data-id="${w.id}">🔊 Nghe</button><button class="btn mini ${P.bookmarks[w.id]?'purple':'ghost'}" data-action="bookmark" data-id="${w.id}">${P.bookmarks[w.id]?'★ Đã lưu':'☆ Lưu'}</button></div></div>`).join('')||'<div class="hintbox">Không tìm thấy mục phù hợp. Hãy thay bộ lọc hoặc từ khóa.</div>'}</div></div>`}
function speak(){const o=SPEAK[S.speakIdx],names=['ANSWER · TRẢ LỜI','REASON · LÝ DO','BENEFIT · MỞ RỘNG'];const combo=S.picks.map((n,i)=>o.parts[i][n]).join(' ');return `${head('🎤 Speaking Idea Builder','Ghép paraphrase → tư duy Socrates → tự nói theo 4 câu hỏi gốc')}
<div class="controlbar" style="margin:15px 0 19px"><div class="field"><label>CHỌN CÂU HỎI</label><select class="select" id="speakSelect">${SPEAK.map((q,i)=>`<option value="${i}" ${i===S.speakIdx?'selected':''}>${i+1}. ${E(q.q)}</option>`).join('')}</select></div></div><div class="speak-cols"><div class="panel"><span class="pill">❓ QUESTION ${S.speakIdx+1}/4</span><h2 style="margin:12px 0">${E(o.q)}</h2><p class="muted small">${E(o.qvi)}</p><div class="divider"></div><h3>🧠 Vấn đáp Socrates</h3>${o.socrates.map((s,i)=>`<div class="review"><span>${['①','②','③','④'][i]}</span><div class="small">${E(s)}</div></div>`).join('')}<h3 style="margin:20px 0 0">🧩 Ghép câu theo 3 bước</h3>${o.parts.map((arr,i)=>`<div class="builder-step"><div class="row between"><span class="eyebrow">${i+1}. ${names[i]}</span><span class="muted small">Chọn 1 idea</span></div><div class="chips">${arr.map((t,j)=>`<button class="chip ${S.picks[i]===j?'active':''}" data-action="pick" data-step="${i}" data-option="${j}">${E(t)}</button>`).join('')}</div></div>`).join('')}<button class="btn ghost mini" data-action="randomIdeas">🎲 Trộn các idea</button></div><div><div class="panel"><div class="row between"><h3>✨ Câu trả lời do bạn tạo</h3><span class="tag">Answer → Reason → Benefit</span></div><div class="quote">${E(combo)}</div><div class="row" style="margin-top:12px"><button class="btn primary" data-action="sayText" data-text="built">🔊 Nghe bài mình ghép</button><button class="btn ghost" data-action="copyBuilt">📋 Sao chép</button></div><div class="divider"></div><div class="row between"><h3>🎓 Bài mẫu tham khảo</h3><button class="btn mini ghost" data-action="model">${S.showSample?'Ẩn bài mẫu':'👀 Hiện bài mẫu'}</button></div>${S.showSample?`<div class="modelbox">${E(o.sample)}<div style="margin-top:10px"><button class="btn mini ghost" data-action="sayText" data-text="model">🔊 Nghe bài mẫu</button></div></div>`:'<p class="muted small">Hãy thử nói trước khi xem bài mẫu, rồi so sánh cách triển khai.</p>'}</div><div class="panel" style="margin-top:15px"><h3>🎙️ Thử nói bằng tiếng Anh</h3><p class="muted small">Nói qua micro (nếu trình duyệt hỗ trợ) hoặc nhập câu của bạn để tự kiểm tra idea. Đây không phải điểm IELTS chính thức.</p><div class="row" style="margin-bottom:11px"><button class="btn purple" data-action="mic">🎙️ Bật micro</button><button class="btn ghost" data-action="sayQuestion">🔊 Nghe câu hỏi</button></div><textarea id="ownSpeaking" class="textarea" placeholder="Your own answer in English…">${E(S.spoken)}</textarea><div style="margin-top:12px" class="row"><button class="btn primary" data-action="checkSpeak">🧠 Kiểm tra idea</button><button class="btn ghost" data-action="resetSpeak">↻ Xóa bài</button></div>${S.speechFeedback?`<div class="feedback"><h3>📊 ${E(S.speechFeedback.title)}</h3><p>${E(S.speechFeedback.detail)}</p><p>💡 ${E(S.speechFeedback.advice)}</p><p><b>Socrates:</b> ${E(o.socrates[S.speechFeedback.next])}</p></div>`:''}</div></div></div>`}
function checkSpeak(){let text=$('#ownSpeaking')?.value.trim()||'';S.spoken=text;if(!text){notify('Hãy viết hoặc nói thử một câu trước khi kiểm tra.');return}let q=SPEAK[S.speakIdx];let keys=q.keys;let flags=keys.map(set=>set.some(k=>text.toLowerCase().includes(k)));let count=flags.filter(Boolean).length;let next=flags.indexOf(false);if(next<0)next=3;S.speechFeedback={title:count===3?'Đã có đủ 3 ý cốt lõi!':'Đã nhận diện '+count+'/3 nhóm ý',detail:`Bạn dùng ${text.split(/\s+/).length} từ. ${flags[0]?'Có trả lời/paraphrase.':'Chưa nhận rõ câu trả lời/paraphrase.'} ${flags[1]?'Có ý lý do.':'Cần ý giải thích lý do.'} ${flags[2]?'Có ý bổ sung.':'Thiếu lợi ích hoặc ý mở rộng.'}`,advice:'Hãy dùng Answer → Reason → Benefit, không cần cố nhồi quá nhiều từ khó. Việc kiểm tra dựa trên từ khóa nên có thể bỏ sót cách diễn đạt đúng khác.',next};if(count===3){P.xp+=8;save();boom()}render()}
function render(){nav();updateStats();let s=S.session;const route=S.page;let out=route==='home'?home():route==='learn'?learn():route==='flash'?flash():route==='speak'?speak():route==='match'&&S.match?matchScreen():s&&s.kind===route?questionScreen():['quiz','spell','listen','match'].includes(route)?modeSetup(route):home();$('#screen').innerHTML=out;if(route==='spell'&&s&&!s.answered)$('#typed')?.focus()}
function exportProgress(){const payload=JSON.stringify({app:'SPORT QUEST',version:2,exportedAt:new Date().toISOString(),progress:P},null,2);const blob=new Blob([payload],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='SPORT_QUEST_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function listen(){voice(currentWord()?.en||'')}
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;switch(act){case'nav':go(b.dataset.page);break;case'group':setgroup(b.dataset.group);break;case'start':init(b.dataset.kind);break;case'sprint':init('quiz',true);break;case'choose':handleAnswer(+b.dataset.idx);break;case'gradeSpell':handleAnswer(0);break;case'spellhint':if(S.session){S.session.hint=true;let val=$('#typed')?.value||'';render();if($('#typed'))$('#typed').value=val}break;case'next':next();break;case'restart':init(b.dataset.kind,b.dataset.sprint==='true');break;case'tile':tile(b.dataset.side,+b.dataset.id);break;case'flip':S.flipped=!S.flipped;render();break;case'flashnext':flashNext(+b.dataset.rate);break;case'flashprev':S.flashIdx=(S.flashIdx-1+S.flashCards.length)%S.flashCards.length;S.flipped=false;render();break;case'rebuildFlash':rebuildFlash();render();break;case'say':voice(getW(+b.dataset.id)?.ex||'');break;case'hear':listen();break;case'bookmark':{let id=+b.dataset.id;P.bookmarks[id]=!P.bookmarks[id];save();render();break}case'pick':S.picks[+b.dataset.step]=+b.dataset.option;render();break;case'randomIdeas':S.picks=S.picks.map(()=>Math.floor(Math.random()*3));render();break;case'model':S.showSample=!S.showSample;S.spoken=$('#ownSpeaking')?.value||S.spoken;render();break;case'sayText':{let q=SPEAK[S.speakIdx],t=b.dataset.text==='built'?S.picks.map((x,i)=>q.parts[i][x]).join(' '):q.sample;voice(t);break}case'copyBuilt':{let q=SPEAK[S.speakIdx],t=S.picks.map((x,i)=>q.parts[i][x]).join(' ');navigator.clipboard?.writeText(t).then(()=>notify('📋 Đã sao chép câu trả lời!')).catch(()=>notify('Hãy chọn và sao chép câu trong khung.'));break}case'sayQuestion':voice(SPEAK[S.speakIdx].q);break;case'checkSpeak':checkSpeak();break;case'resetSpeak':S.spoken='';S.speechFeedback=null;render();break;case'mic':mic();break;case'export':exportProgress();break;case'resetAll':if(confirm('Xóa toàn bộ XP, chuỗi học, dấu sao và tiến độ của 127 từ? Hành động này không thể hoàn tác.')){P={...EMPTY,mastery:{},seen:{},bookmarks:{}};save();go('home');notify('Đã đưa tiến độ về 0. Có thể học lại từ đầu.')}break;}});
document.addEventListener('change',ev=>{let t=ev.target;if(t.id==='groupSelect'){S.group=t.value;if(S.page==='flash')rebuildFlash();render()}else if(t.id==='sizeSelect'){S.size=t.value}else if(t.id==='filterWord'){S.filter=t.value;render()}else if(t.id==='speakSelect'){S.speakIdx=+t.value;S.picks=[0,0,0];S.showSample=false;S.spoken='';S.speechFeedback=null;render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='searchWord'){let f=ev.target;const ss=f.selectionStart;S.search=f.value;render();const n=$('#searchWord');n?.focus();if(n&&ss!=null)n.setSelectionRange(ss,ss)}if(ev.target.id==='ownSpeaking')S.spoken=ev.target.value});
document.addEventListener('keydown',ev=>{if(ev.target?.matches('textarea,select,input')&&!(ev.key==='Enter'&&ev.target.id==='typed'))return;let s=S.session;if(S.page==='flash'){if(ev.key===' '){ev.preventDefault();S.flipped=!S.flipped;render()}else if(ev.key==='ArrowRight'){ev.preventDefault();S.flashIdx=(S.flashIdx+1)%S.flashCards.length;S.flipped=false;render()}else if(ev.key==='ArrowLeft'){ev.preventDefault();S.flashIdx=(S.flashIdx-1+S.flashCards.length)%S.flashCards.length;S.flipped=false;render()}return}if(s&&['quiz','listen','spell'].includes(s.kind)){if(ev.key==='Enter'){ev.preventDefault();if(s.answered)next();else if(s.kind==='spell')handleAnswer(0)}else if(!s.answered&&s.kind!=='spell'&&'1234'.includes(ev.key)){ev.preventDefault();handleAnswer(+ev.key-1)}}});
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify('Micro nhận dạng chưa được hỗ trợ. Bạn có thể gõ câu tự nói vào khung.');return}try{if(recog){recog.stop();recog=null;return}recog=new SR();recog.lang='en-GB';recog.interimResults=false;recog.maxAlternatives=1;recog.onresult=e=>{S.spoken=(S.spoken?S.spoken+' ':'')+e.results[0][0].transcript;let a=$('#ownSpeaking');if(a)a.value=S.spoken;notify('🎤 Đã ghi nhận lời nói. Bấm “Kiểm tra idea”.')};recog.onerror=()=>notify('Chưa nhận được giọng nói. Hãy thử lại hoặc nhập văn bản.');recog.onend=()=>{recog=null};recog.start();notify('🎙️ Đang nghe. Hãy nói rõ, chậm và tự nhiên.')}catch(e){notify('Không mở được micro. Bạn vẫn có thể gõ câu trả lời.')}}
render();})();
</script></body></html>
